name: GSX-R600 hunt part two

on:
  schedule:
    - cron: '30 * * * *'   # hourly: alerts on NEW matches only
    - cron: '0 13 * * *'   # daily report, 13:00 UTC = 8 AM US Central (daylight time)
  workflow_dispatch:        # "Run workflow" button
    inputs:
      mode:
        description: 'report = send daily report | test = diagnostics only (read the log, no alerts)'
        type: choice
        options: [report, test]
        default: report

permissions:
  contents: write

concurrency:
  group: hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements_part_two.txt
      - name: Install dependencies
        run: |
          pip install -r requirements_part_two.txt
          playwright install --with-deps chromium
      - name: Run hunter
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "test" ]; then
            python bike_hunter_part_two.py --test
          elif [ "${{ github.event.schedule }}" = "0 13 * * *" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python bike_hunter_part_two.py --daily
          else
            python bike_hunter_part_two.py
          fi
      - name: Save seen listings
        run: |
          git config user.name "hunt-bot"
          git config user.email "hunt-bot@users.noreply.github.com"
          git add seen.json || true
          git diff --staged --quiet || (git commit -m "update seen listings" && git pull --rebase && git push)
